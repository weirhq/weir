syntax = "proto3";

package weir.api.v1alpha;

import "google/protobuf/field_mask.proto";
import "weir/api/v1alpha/user.proto";

option go_package = "github.com/weirhq/weir/proto/weir/api/v1alpha;apiv1alpha";

// Server administration. Every RPC requires the admin role and a login
// within the last 10 minutes.
service Admin {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Deleting a user revokes all of their devices.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
  Role role = 4;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string display_name = 2;
  Role role = 3;
  // Setting a password revokes all of the user's devices.
  string password = 4;
  // Which of display_name, role and password to change.
  google.protobuf.FieldMask update_mask = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}
