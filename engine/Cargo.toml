[workspace]
resolver = "3"
members = ["weir-engine", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
engine-proto = { path = "crates/proto" }
probe = { path = "crates/probe" }
session = { path = "crates/session" }

clap = { version = "4.6.7", features = ["derive", "env"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "fs"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
