syntax = "proto3";

package weir.api.v1alpha;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "weir/api/v1alpha/library.proto";
import "weir/api/v1alpha/user.proto";

option go_package = "github.com/weirhq/weir/proto/weir/api/v1alpha;apiv1alpha";

// Server administration. Every RPC requires the admin role and a login
// within the last 10 minutes.
service Admin {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Deleting a user revokes all of their devices.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse);
  // Creating a library queues its first scan.
  rpc CreateLibrary(CreateLibraryRequest) returns (CreateLibraryResponse);
  rpc UpdateLibrary(UpdateLibraryRequest) returns (UpdateLibraryResponse);
  // Removes the library and everything scanned into it. Files on disk are
  // never touched.
  rpc DeleteLibrary(DeleteLibraryRequest) returns (DeleteLibraryResponse);
  // Queues a scan. A scan already queued or running for the library absorbs
  // the request.
  rpc ScanLibrary(ScanLibraryRequest) returns (ScanLibraryResponse);

  // What a member may do in each library. Admins can do everything
  // everywhere and have no access rows.
  rpc GetLibraryAccess(GetLibraryAccessRequest) returns (GetLibraryAccessResponse);
  // Replaces the user's access with the list given; libraries left out are
  // closed to them.
  rpc SetLibraryAccess(SetLibraryAccessRequest) returns (SetLibraryAccessResponse);

  // The engine's health and capabilities, and the latest background jobs.
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
  Role role = 4;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string display_name = 2;
  Role role = 3;
  // Setting a password revokes all of the user's devices.
  string password = 4;
  // Which of display_name, role and password to change.
  google.protobuf.FieldMask update_mask = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message ListLibrariesRequest {}

message ListLibrariesResponse {
  repeated Library libraries = 1;
  // The server's configured library_paths. Every library folder must be
  // one of these or under one.
  repeated string library_paths = 2;
}

message CreateLibraryRequest {
  string name = 1;
  LibraryKind kind = 2;
  repeated string paths = 3;
}

message CreateLibraryResponse {
  Library library = 1;
}

message UpdateLibraryRequest {
  string id = 1;
  string name = 2;
  repeated string paths = 3;
  // Which of name and paths to change. The kind is fixed at creation.
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateLibraryResponse {
  Library library = 1;
}

message DeleteLibraryRequest {
  string id = 1;
}

message DeleteLibraryResponse {}

message ScanLibraryRequest {
  string id = 1;
}

message ScanLibraryResponse {}

message LibraryAccess {
  string library_id = 1;
  // See the library and its items.
  bool view = 2;
  // Play them; implies view.
  bool play = 3;
  // Change the library's folders and scan it; implies view.
  bool manage = 4;
}

message GetLibraryAccessRequest {
  string user_id = 1;
}

message GetLibraryAccessResponse {
  repeated LibraryAccess access = 1;
}

message SetLibraryAccessRequest {
  string user_id = 1;
  repeated LibraryAccess access = 2;
}

message SetLibraryAccessResponse {}

message GetServerStatusRequest {}

message GetServerStatusResponse {
  EngineStatus engine = 1;
  // Newest first.
  repeated Job recent_jobs = 2;
}

message EngineStatus {
  bool healthy = 1;
  string engine_version = 2;
  string ffmpeg_version = 3;
  uint32 max_sessions = 4;
  uint32 active_sessions = 5;
  // Hardware the engine found, e.g. "VAAPI: Intel UHD Graphics 770".
  repeated string hardware = 6;
}

message Job {
  string id = 1;
  // "scan_library" or "refresh_metadata".
  string kind = 2;
  string library_id = 3;
  JobState state = 4;
  uint32 attempt = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  // The last error, if any.
  string error = 8;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_WAITING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_COMPLETED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}
