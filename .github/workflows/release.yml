name: release

# Releases the server or the engine from a server/vX.Y.Z or engine/vX.Y.Z
# tag: builds both architectures, smoke-tests the images and tarball,
# pushes the images and publishes a GitHub release. Pushes to main that
# touch packaging, and manual runs, do everything up to the push.
# Runbook: docs/runbooks/release.md

on:
  workflow_dispatch:
  push:
    tags: ['server/v*', 'engine/v*']
    # Path filters don't apply to tags.
    branches: [main]
    paths:
      - deploy/**
      - tools/release/**
      - MODULE.bazel
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: check versions
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      component: ${{ steps.check.outputs.component }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      server_version: ${{ steps.check.outputs.server_version }}
      engine_version: ${{ steps.check.outputs.engine_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions agree, and with the tag
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tools/release/check.sh "$GITHUB_REF_NAME" notes.md | tee -a "$GITHUB_OUTPUT"
            echo publish=true >> "$GITHUB_OUTPUT"
            cat notes.md
          else
            tools/release/check.sh | tee -a "$GITHUB_OUTPUT"
            echo publish=false >> "$GITHUB_OUTPUT"
          fi
      - name: The engine the Compose file names is published
        if: steps.check.outputs.component == 'server'
        env:
          ENGINE_VERSION: ${{ steps.check.outputs.engine_version }}
        run: |
          if ! tools/release/pullable.sh engine "$ENGINE_VERSION"; then
            echo "::error::ghcr.io/weirhq/engine:$ENGINE_VERSION isn't published; release engine/v$ENGINE_VERSION first."
            exit 1
          fi

  verify:
    name: build and smoke test (linux/${{ matrix.arch }})
    needs: check
    strategy:
      # One architecture failing shouldn't hide how the other went.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SERVER_VERSION: ${{ needs.check.outputs.server_version }}
      ENGINE_VERSION: ${{ needs.check.outputs.engine_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bazelisk, which the arm64 runner doesn't come with.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: bazelisk
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.arch }}
          repository-cache: true
      - name: Allow Bazel's Linux sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: tools/bin/bazel build --config=ci //deploy:server //deploy:engine //deploy:weir //deploy:tarball
      - name: Check the tarball and make test media with its ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libva2 libva-drm2 libdrm2
          tarball=bazel-bin/deploy/weir-$SERVER_VERSION-linux-${{ matrix.arch }}.tar.gz
          mkdir -p tarball && cp "$tarball" tarball/
          tar -C "$RUNNER_TEMP" -xzf "$tarball"
          weir=$RUNNER_TEMP/weir-$SERVER_VERSION
          "$weir/bin/weir-engine" --version | grep -Fx "weir-engine $ENGINE_VERSION"
          "$weir/lib/ffmpeg/bin/ffmpeg" -hide_banner -version | head -n 1
          tools/release/make-media.sh "$weir/lib/ffmpeg/bin/ffmpeg" "$RUNNER_TEMP/media"
      - name: Load the images
        run: |
          for image in server engine weir; do
            tools/bin/bazel run --config=ci "//deploy:${image}_load"
          done
      - name: Smoke test with Compose
        run: tools/release/smoke.sh compose "$RUNNER_TEMP/media"
      - name: Smoke test the all-in-one image
        run: tools/release/smoke.sh all-in-one "$RUNNER_TEMP/media"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.arch }}
          path: tarball/
          if-no-files-found: error

  # Only once both architectures pass, so a failure leaves nothing pushed.
  push:
    name: push images (linux/${{ matrix.arch }})
    needs: [check, verify]
    if: needs.check.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      COMPONENT: ${{ needs.check.outputs.component }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: bazelisk
      # The same cache as verify, so this mostly just pushes.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.arch }}
          repository-cache: true
      - name: Allow Bazel's Linux sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sign in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push ${{ needs.check.outputs.version }}-${{ matrix.arch }}
        run: |
          if [ "$COMPONENT" = server ]; then images="server weir"; else images=engine; fi
          for image in $images; do
            tools/bin/bazel run --config=ci "//deploy:${image}_push" -- --tag "$VERSION-${{ matrix.arch }}"
          done

  release:
    name: publish
    needs: [check, push]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      COMPONENT: ${{ needs.check.outputs.component }}
      VERSION: ${{ needs.check.outputs.version }}
      ENGINE_VERSION: ${{ needs.check.outputs.engine_version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to ghcr.io
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Join the architectures under ${{ needs.check.outputs.version }}
        run: |
          if [ "$COMPONENT" = server ]; then images="server weir"; else images=engine; fi
          echo "IMAGES=$images" >> "$GITHUB_ENV"
          for image in $images; do
            ref=ghcr.io/weirhq/$image:$VERSION
            docker buildx imagetools create -t "$ref" "$ref-amd64" "$ref-arm64"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.check.outputs.component == 'server'
        with:
          pattern: tarball-*
          path: tarballs
          merge-multiple: true
      - name: Gather the release files
        if: needs.check.outputs.component == 'server'
        run: tools/release/assets.sh "$VERSION" "$ENGINE_VERSION" tarballs assets
      - name: Draft the release
        run: |
          tools/release/check.sh "$GITHUB_REF_NAME" notes.md >/dev/null
          # A re-run finds the draft from the run before.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=()
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${flags[@]}" \
              --title "Weir $COMPONENT $VERSION" --notes-file notes.md
          fi
          if [ -d assets ]; then gh release upload "$GITHUB_REF_NAME" --clobber assets/*; fi
      - name: The images can be pulled without signing in
        run: |
          private=()
          for image in $IMAGES; do
            tools/release/pullable.sh "$image" "$VERSION" || private+=("$image")
          done
          if [ ${#private[@]} -gt 0 ]; then
            for image in "${private[@]}"; do
              echo "::error::ghcr.io/weirhq/$image is private. Make it public: https://github.com/orgs/weirhq/packages/container/$image/settings"
            done
            echo "The release is still a draft; re-run this job once the packages are public."
            exit 1
          fi
      - name: Publish the release
        run: |
          # Server releases are what people install, so they are Latest;
          # engine releases and pre-releases never are.
          latest=false
          [ "$COMPONENT" = server ] && [ "$PRERELEASE" = false ] && latest=true
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
