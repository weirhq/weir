# Postgres for local development and integration tests.
name: weir-dev
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: weir
      POSTGRES_PASSWORD: weir
      POSTGRES_DB: weir
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "weir"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres:
