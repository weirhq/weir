name: ffmpeg

# Builds Weir's ffmpeg for each Linux architecture. A build whose release tag
# doesn't exist yet is published; an existing release is never overwritten,
# so the weekly run only checks the build still works.
# Runbook: docs/runbooks/ffmpeg.md

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]
    paths:
      - third_party/ffmpeg/**
      - .github/workflows/ffmpeg.yml

permissions:
  contents: read

jobs:
  build:
    name: build (linux/${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t weir-ffmpeg-build third_party/ffmpeg
      - run: docker run --rm -v "$PWD:/src" -w /src weir-ffmpeg-build third_party/ffmpeg/build.sh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-linux-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Publish if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source third_party/ffmpeg/source.env
          tag="ffmpeg-${FFMPEG_VERSION}-${BUILD_REVISION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published; leaving it alone."
            exit 0
          fi
          {
            echo "ffmpeg ${FFMPEG_VERSION}, Weir build ${BUILD_REVISION}, for the engine."
            echo
            echo '```'
            cat out/*.sha256
            echo '```'
            echo
            echo "Pin it with \`tools/ffmpeg/pin.sh\`."
          } > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA" out/*
